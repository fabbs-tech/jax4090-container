name: Build and Push JAX Container

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Extra tag for this build (e.g. jax0.4.38-cuda12.6)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: tags
        shell: bash
        run: |
          tags="ghcr.io/fabbs-tech/jax4090-container:latest"
          if [ -n "${{ inputs.tag }}" ]; then
            tags="$tags
          ghcr.io/fabbs-tech/jax4090-container:${{ inputs.tag }}"
          fi
          {
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # provenance:false / sbom:false: by default buildx wraps each tag
      # in an OCI image index that references a platform manifest *and*
      # an attestation manifest (os/arch unknown/unknown). GHCR exposes
      # the index as "tagged" but the referenced manifests appear as
      # untagged package versions — and the cleanup workflow's
      # delete-package-versions@v5 is not reference-aware, so it prunes
      # them as orphans and the next pull of :latest fails with
      # `manifest unknown`. Disabling both flattens each tag to a single
      # platform manifest, making the existing cleanup safe. See
      # tooling/dev_notes/log/ghcr_manifest_unknown_oci_index_cleanup.md.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
